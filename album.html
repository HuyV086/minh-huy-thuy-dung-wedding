<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Album — Minh Huy & Thuỳ Dung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ivory-light:#FBF6EF;
  --ivory-deep:#F3E9DD;
  --rose:#7C1B27;
  --gold:#B8903F;
  --gold-light:#E6C27A;
  --ink:#2B2420;
  --ink-soft:#6b5f54;
  --font-display:'Cormorant Garamond', 'Times New Roman', serif;
  --font-body:'Be Vietnam Pro', -apple-system, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{background:var(--ivory-light); color:var(--ink); font-family:var(--font-body); overflow-x:hidden;}
img,video{max-width:100%; display:block;}

.nav{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between;
  padding:14px 20px; background:rgba(251,246,239,.92); backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(184,144,63,.25);
}
.nav .brand{font-family:var(--font-display); font-size:19px; color:var(--rose);}

.hero{position:relative; height:46vh; min-height:280px; max-height:460px; overflow:hidden;}
.hero img{width:100%; height:100%; object-fit:cover;}
.hero::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(43,36,32,.08) 0%, rgba(43,36,32,.08) 40%, rgba(43,36,32,.6) 100%);}
.hero-copy{position:absolute; left:0; right:0; bottom:0; padding:0 24px 28px; color:#fff;}
.hero-eyebrow{font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold-light); margin-bottom:8px;}
.hero h1{font-family:var(--font-display); font-weight:500; font-size:clamp(28px,5.5vw,46px); margin:0 0 6px;}
.hero p{margin:0; font-size:13px; opacity:.88; max-width:460px;}

.chips{display:flex; gap:9px; overflow-x:auto; padding:16px 20px 14px; scrollbar-width:none; position:sticky; top:57px; z-index:20; background:var(--ivory-light);}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto; font-size:12.5px; font-weight:500; padding:8px 15px; border-radius:999px; border:1px solid rgba(124,27,39,.25); background:var(--ivory-deep); color:var(--rose); cursor:pointer; white-space:nowrap; text-decoration:none;}
.chip.soon{opacity:.6;}

.shelf{padding:4px 20px 40px; max-width:900px; margin:0 auto;}

.album{border-top:1px solid rgba(184,144,63,.3); scroll-margin-top:122px;}
.album:last-child{border-bottom:1px solid rgba(184,144,63,.3);}

.album-head{display:flex; align-items:center; gap:16px; padding:16px 4px; cursor:pointer; background:none; border:none; width:100%; text-align:left; font-family:inherit;}
.album-head .cover{
  width:66px; height:88px; border-radius:3px; flex:0 0 auto; object-fit:cover;
  box-shadow:0 6px 16px rgba(43,36,32,.22); background:var(--ivory-deep);
}
.album-head .cover.icon{
  display:flex; align-items:center; justify-content:center; font-size:20px; color:#fff;
  background:linear-gradient(135deg, var(--rose), #9c3a44);
}
.album-head .cover.soon{
  display:flex; align-items:center; justify-content:center; color:var(--gold); font-size:22px;
  border:1px dashed rgba(184,144,63,.5); box-shadow:none;
}
.album-head .info{flex:1; min-width:0;}
.album-head h2{font-family:var(--font-display); font-weight:500; font-size:22px; margin:0 0 3px; color:var(--rose);}
.album-head .meta{font-size:12px; color:var(--ink-soft);}
.album-head .meta.soon{color:var(--gold);}
.album-head .chevron{flex:0 0 auto; width:28px; height:28px; border-radius:50%; border:1px solid rgba(124,27,39,.3); display:flex; align-items:center; justify-content:center; color:var(--rose); transition:transform .3s ease; font-size:13px;}
.album.open .album-head .chevron{transform:rotate(180deg);}

.album-body{max-height:0; overflow:hidden; transition:max-height .45s ease;}
.album-body-inner{padding:4px 4px 24px;}

.coming-msg{padding:22px; text-align:center; color:var(--ink-soft); font-size:13px; border:1px dashed rgba(184,144,63,.4); border-radius:8px; background:var(--ivory-deep);}

.grid{display:grid; grid-template-columns:repeat(4,1fr); gap:9px;}
.grid figure{margin:0; position:relative; overflow:hidden; border-radius:4px; cursor:zoom-in; background:var(--ivory-deep); aspect-ratio:3/4;}
.grid figure img,.grid figure video{width:100%; height:100%; object-fit:cover; transition:transform .4s ease;}
.grid figure:hover img{transform:scale(1.05);}
.grid figure.is-video::before{content:"▶"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; background:rgba(43,36,32,.3); z-index:1;}
@media (max-width:640px){ .grid{grid-template-columns:repeat(3,1fr);} }

.foot{margin-top:10px; padding:20px 20px 34px; text-align:center; color:var(--ink-soft); font-size:12px;}

.lightbox{position:fixed; inset:0; background:rgba(20,16,14,.95); z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px;}
.lightbox[hidden]{display:none;}
.lightbox img, .lightbox video{max-width:min(90vw,860px); max-height:72vh; object-fit:contain; border-radius:2px;}
.lightbox .lb-close, .lightbox .lb-nav{position:absolute; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.25); color:#fff; border-radius:50%; width:40px; height:40px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:17px;}
.lightbox .lb-close{top:16px; right:16px;}
.lightbox .lb-prev{left:12px; top:46%; transform:translateY(-50%);}
.lightbox .lb-next{right:12px; top:46%; transform:translateY(-50%);}
.lb-bar{display:flex; align-items:center; gap:14px; margin-top:16px;}
.lb-count{color:rgba(255,255,255,.7); font-size:12px; letter-spacing:.07em;}
.lb-download{
  display:flex; align-items:center; gap:7px; background:var(--gold); color:#2b2420; border:none;
  border-radius:999px; padding:8px 16px; font-size:12.5px; font-weight:600; cursor:pointer; text-decoration:none;
}
.lb-download svg{width:14px; height:14px;}
</style>
</head>
<body>

<div class="nav">
  <div class="brand">Minh Huy &amp; Thuỳ Dung</div>
</div>

<div class="hero">
  <img src="images/hero.jpg" alt="Minh Huy và Thuỳ Dung">
  <div class="hero-copy">
    <div class="hero-eyebrow">Lưu giữ cho người thân &amp; bạn bè</div>
    <h1>Những cuốn album<br>của ngày hôm ấy</h1>
    <p>Chọn 1 album bên dưới để mở ra xem.</p>
  </div>
</div>

<nav class="chips" id="chips"></nav>
<div class="shelf" id="shelf"></div>
<div class="foot">Được lưu giữ với ♥ cho người thân &amp; bạn bè — Minh Huy &amp; Thuỳ Dung, 18.10.2026</div>

<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lbClose" aria-label="Đóng">✕</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Ảnh trước">‹</button>
  <div id="lbMedia"></div>
  <button class="lb-nav lb-next" id="lbNext" aria-label="Ảnh sau">›</button>
  <div class="lb-bar">
    <span class="lb-count" id="lbCount"></span>
    <a class="lb-download" id="lbDownload">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
      Tải về
    </a>
  </div>
</div>

<script>
(function(){
  var chipsEl = document.getElementById('chips');
  var shelfEl = document.getElementById('shelf');
  var flatItems = [];

  fetch('data/media.json').then(function(r){ return r.json(); }).then(function(data){
    render(data.chapters || []);
  }).catch(function(err){
    shelfEl.innerHTML = '<p style="padding:40px 4px;color:var(--ink-soft)">Không tải được data/media.json: '+err+'</p>';
  });

  function render(chapters){
    chipsEl.innerHTML = chapters.map(function(c){
      return '<a class="chip'+(c.comingSoon?' soon':'')+'" href="#'+c.id+'">'+c.title+'</a>';
    }).join('');

    shelfEl.innerHTML = chapters.map(function(c){
      var coverHtml;
      if(c.comingSoon){
        coverHtml = '<div class="cover soon">◐</div>';
      } else if(c.cover){
        coverHtml = '<img class="cover" src="'+c.cover+'" alt="">';
      } else {
        coverHtml = '<div class="cover icon">▶</div>';
      }
      var meta = c.comingSoon ? 'Sắp cập nhật' : (c.items.length + ' mục');
      return '<div class="album" id="'+c.id+'" data-id="'+c.id+'">'+
        '<button type="button" class="album-head">'+
          coverHtml+
          '<div class="info"><h2>'+c.title+'</h2><div class="meta'+(c.comingSoon?' soon':'')+'">'+meta+'</div></div>'+
          '<div class="chevron">▾</div>'+
        '</button>'+
        '<div class="album-body"><div class="album-body-inner">'+
          (c.comingSoon
            ? '<div class="coming-msg">Ảnh/video chương này sẽ được thêm sau.</div>'
            : '<div class="grid" data-id="'+c.id+'"></div>')+
        '</div></div>'+
      '</div>';
    }).join('');

    chapters.forEach(function(c){
      if(c.comingSoon) return;
      var grid = shelfEl.querySelector('.grid[data-id="'+c.id+'"]');
      grid.innerHTML = c.items.map(function(item){
        var idx = flatItems.length;
        flatItems.push(item);
        if(item.type === 'video'){
          return '<figure class="is-video" data-idx="'+idx+'"><video src="'+item.src+'" preload="metadata" muted></video></figure>';
        }
        return '<figure data-idx="'+idx+'"><img src="'+item.src+'" loading="lazy" alt="'+(item.caption||'Ảnh cưới')+'"></figure>';
      }).join('');
    });

    setupAccordion();
    setupLightbox();

    if(location.hash){
      var id = location.hash.slice(1);
      if(document.getElementById(id)) openAlbum(id, true);
    }
  }

  var albumEls = [];
  function setupAccordion(){
    albumEls = Array.prototype.slice.call(document.querySelectorAll('.album'));
    albumEls.forEach(function(el){
      var head = el.querySelector('.album-head');
      head.addEventListener('click', function(){ toggleAlbum(el); });
    });
  }

  function toggleAlbum(el){
    var isOpen = el.classList.contains('open');
    albumEls.forEach(function(other){
      other.classList.remove('open');
      other.querySelector('.album-body').style.maxHeight = null;
    });
    if(!isOpen){
      el.classList.add('open');
      el.querySelector('.album-body').style.maxHeight = el.querySelector('.album-body').scrollHeight + 'px';
    }
  }

  function openAlbum(id, thenScroll){
    var el = document.getElementById(id);
    if(!el) return;
    if(!el.classList.contains('open')) el.querySelector('.album-head').click();
    if(thenScroll){
      // album khác đang đóng lại cùng lúc (transition .45s) làm vị trí dịch chuyển,
      // nên giữ vị trí cuộn trong lúc animation chạy thay vì cuộn 1 lần duy nhất
      var tries = 0;
      (function hold(){
        el.scrollIntoView({block:'start'});
        if(++tries < 30) requestAnimationFrame(hold);
      })();
    }
  }

  chipsEl.addEventListener('click', function(e){
    var a = e.target.closest('.chip');
    if(!a) return;
    e.preventDefault();
    openAlbum(a.getAttribute('href').slice(1), true);
  });

  function setupLightbox(){
    var lb = document.getElementById('lightbox');
    var lbMedia = document.getElementById('lbMedia');
    var lbCount = document.getElementById('lbCount');
    var lbDownload = document.getElementById('lbDownload');
    var cur = 0;

    function show(i){
      cur = i;
      var item = flatItems[cur];
      if(item.type === 'video'){
        lbMedia.innerHTML = '<video src="'+item.src+'" controls autoplay></video>';
      } else {
        lbMedia.innerHTML = '<img src="'+item.src+'" alt="">';
      }
      lbDownload.href = item.src;
      lbDownload.setAttribute('download', '');
      lbCount.textContent = (cur+1) + ' / ' + flatItems.length;
      lb.hidden = false;
    }
    function close(){ lb.hidden = true; lbMedia.innerHTML = ''; }
    function step(d){ show((cur + d + flatItems.length) % flatItems.length); }

    shelfEl.addEventListener('click', function(e){
      var fig = e.target.closest('figure');
      if(fig){ show(parseInt(fig.getAttribute('data-idx'),10)); }
    });
    document.getElementById('lbClose').addEventListener('click', close);
    document.getElementById('lbPrev').addEventListener('click', function(){ step(-1); });
    document.getElementById('lbNext').addEventListener('click', function(){ step(1); });
    lb.addEventListener('click', function(e){ if(e.target === lb) close(); });
    document.addEventListener('keydown', function(e){
      if(lb.hidden) return;
      if(e.key === 'Escape') close();
      if(e.key === 'ArrowLeft') step(-1);
      if(e.key === 'ArrowRight') step(1);
    });
  }
})();
</script>
</body>
</html>
